<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hiperligações</title>
    <!-- CSS -->
    <style>
        a {
            margin-bottom: 20px;
            display: block;
            color: #fff;
            font: 1.5em system-ui;
        }

        img {
            width: 20%;
        }

        .caixa1, #caixa2 {
            padding: 10px;
        }

        .caixa1 {
            margin-bottom: 10px;
            background-color: brown;
        }

        #caixa2 {
            background-color: teal;
        }
    </style>
</head>

<body>

    <div class="caixa1">
        <!-- Não irá funcionar por estar fora do servidor da página -->
        <a href="https://www.sys4soft.com/udemy/texto.txt" download="texto">Baixar texto</a>
    </div>

    <div id="caixa2">
        <!-- Irá funcionar por estar fora do servidor da página -->
        <a href="../arquivos/arquivo-texto.txt" download="arquivo-texto.txt">Baixar texto</a>
        <a href="../arquivos/estudante.jpg" download="estudante.jpg">Baixar imagem</a>
        <a href="../arquivos/estudante.jpg" download="estudante.jpg">
            <img src="../arquivos/estudante.jpg" alt="estudante">
        </a>
    </div>

</body>

</html>
