<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title></title>
    <!-- CSS -->
    <style>
        a {
            margin-bottom: 20px;
            display: block;
            font: 1.5em system-ui;
        }
    </style>
</head>

<body>
    
    <p>
        <a href="https://www.google.com" target="_self" title="Mesma guia">Google</a>
        <a href="https://www.google.com" target="_blank" title="Nova guia">Google</a>
    </p>

    <!-- Não usar esses targets -->
    <p>
        <a href="http://www.google.com" target="_parent" title="_parent">Google - (não usar)</a>
        <a href="http://www.google.com" target="_top" title="_top">Google - (Não usar)</a>
    </p>
    
</body>

</html>
