<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Botão com CSS3</title>
    <!-- CSS -->
    <style>
        body {
            margin: 0;
            padding: 0;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: rgb(34, 48, 61);
        }

        .layout {
            margin: 50px;
            text-align: center;
        }

        .link {
            padding: 10px 30px;
            border-radius: 10px;
            text-decoration: none;
            color: rgb(231, 231, 231);
            background-color: rgb(28, 114, 163);
        }

        .link:hover {
            color: rgb(231, 231, 231);
            background-color: rgb(22, 94, 136);
        }
    </style>
</head>

<body>
    
    <div class="layout">
        <p>
            Olá, mundo!
        </p>
        <a href="https://google.com" class="link" target="_blank">Visitar Google</a>
    </div>
    
</body>

</html>
