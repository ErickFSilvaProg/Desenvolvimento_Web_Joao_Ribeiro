<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Atributo Download</title>
    <!-- CSS -->
    <link rel="stylesheet" href="assets/estilos.css">
</head>

<body>

    <header id="cabecalho">
        <h1>
            Atributo de download
        </h1>
        <p>
            O recurso de download só está disponível para arquivos dentro do servidor da página.
        </p>
    </header>
    <hr>

    <nav id="navegacao">
        <!-- Não irá funcionar porque é um recurso externo ao servidor da página/aplicação -->
        <a href="http://www.sys4soft.com/udemy/texto.txt" target="_blank" download="arquivo_de_texto">Baixar texto (Não irá funcionar)</a>


        <!-- Nos próximos exemplos os recursos irão funcionar porque estão dentro do mesmo servidor da página/aplicação -->
        <ol class="lista">
            <li>
                <a href="assets/downloads/arquivo-texto.txt" download="arquivo_de_texto">Baixar texto</a>
            </li>
            <li>
                <a href="assets/downloads/estudante.jpg" download>Baixar imagem</a>
            </li>
            <li>
                <a href="assets/downloads/google_logo.png" download="Logo do Google">
                    <img src="assets/downloads/google_logo.png" alt="Logo do Google">
                </a>
            </li>
        </ol>
    </nav>

</body>

</html>
