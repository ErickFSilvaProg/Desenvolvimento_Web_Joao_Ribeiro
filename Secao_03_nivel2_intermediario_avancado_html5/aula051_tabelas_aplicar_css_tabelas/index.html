<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tabelas HTML</title>
    <!-- CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>
            Tabela HTML
        </h1>
    </header>

    <table>
        <thead><!-- Cabeçalho da tabela -->
            <tr><!-- Linha -->
                <th>Coluna 1 - Linha 1</th><!-- Coluna/célula -->
                <th>Coluna 2 - Linha 1</th>
                <th>Coluna 3 - Linha 1</th>
                <th>Coluna 4 - Linha 1</th>
            </tr>
        </thead>
        <tbody><!-- Corpo da tabela -->
            <tr><!-- Linha -->
                <th>Coluna 1 - Linha 2</th><!-- Coluna/célula -->
                <td>Coluna 2 - Linha 2</td>
                <td>Coluna 3 - Linha 2</td>
                <td>Coluna 4 - Linha 2</td>
            </tr>
            <tr>
                <th>Coluna 1 - Linha 3</th>
                <td>Coluna 2 - Linha 3</td>
                <td>Coluna 3 - Linha 3</td>
                <td>Coluna 4 - Linha 3</td>
            </tr>
        </tbody>
        <tfoot><!-- Rodapé da tabela -->
            <tr><!-- Linha -->
                <th>Rodapé 1</th><!-- Coluna/célula -->
                <td>Rodapé 2</td>
                <td>Rodapé 3</td>
                <td>Rodapé 4</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
